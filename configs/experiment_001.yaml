# Experiment 1: SmolLM2-135M Python specialization
# Reproduce end to end with scripts/run_pipeline.sh, or train with:
#   python model/train.py configs/experiment_001.yaml --variant python
#
# Scientific design (same 30M-token budget for each trained variant):
#   A = base SmolLM2-135M            (no training; eval only)
#   B = base + 30M GENERAL tokens    (control: variant=general)
#   C = base + 30M PYTHON tokens     (treatment: variant=python)
# Compare A / B / C on the same held-out Python benchmark.

experiment: experiment_001
seed: 42

model:
  base: HuggingFaceTB/SmolLM2-135M
  seq_len: 2048

data:
  # Python source for variant=python.
  #   starcoderdata      : inline content, no AWS, gated (instant). Recommended.
  #   the-stack-v2-dedup : gated + needs AWS creds (content from SWH S3); scale.
  #   codeparrot         : no gate, but script-based (datasets 5.x risk).
  source: starcoderdata
  language: Python

  # General source for the control (variant=general).
  general_source: fineweb-edu   # HuggingFaceFW/fineweb-edu sample-10BT

  # Token budgets, measured by the base tokenizer.
  train_tokens: 30000000
  eval_heldout_files: 2000      # held out BEFORE any training, never trained on

  # Download overshoot: collect this multiple of train_tokens (raw, pre-clean),
  # because cleaning + dedup throw a lot away.
  overshoot: 2.5   # starcoderdata post-parse yield ~0.46; 2.5 lands ~30M clean

  raw_dir: data/raw
  clean_dir: data/clean
  dedup_dir: data/dedup
  general_dir: data/general
  heldout_dir: data/eval_heldout
  cache_dir: data/cache

clean:
  min_lines: 5
  max_lines: 20000
  max_line_length: 1000
  max_avg_line_length: 100
  min_alpha_ratio: 0.25          # fraction of alphanumeric chars
  max_non_ascii_ratio: 0.20
  require_parse: true            # must ast.parse() as valid Python 3
  drop_markers:                  # substrings that flag generated/vendored code
    - "autogenerated"
    - "auto-generated"
    - "automatically generated"
    - "do not edit"
    - "do not modify"
    - "generated by"
    - "@generated"

dedup:
  exact: true                    # sha256 of normalized content
  near: true                     # MinHash LSH (needs datasketch)
  near_threshold: 0.85
  num_perm: 128

train:
  variant: python                # python -> model C ; general -> model B
  lr: 3.0e-5
  epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.1
  per_device_batch_size: 8
  grad_accum: 4
  precision: bf16                # falls back to fp32 on CPU / unsupported GPU
  lr_scheduler: cosine
  logging_steps: 20
  save_steps: 500
  save_total_limit: 2
  gradient_checkpointing: false
  runs_dir: runs

eval:
  problems_file: eval/problems/problems.jsonl
  completion_file: eval/problems/completion.jsonl
  fim_file: eval/problems/fim.jsonl
  max_new_tokens: 256
  temperature: 0.0               # 0 = greedy, deterministic
  num_samples: 1                 # pass@1; raise for pass@k
  timeout_sec: 10
  results_dir: eval/results
