# Offline smoke test (scripts/smoke.sh): a ~1M-param model on Python stdlib
# source instead of starcoderdata. Exercises every step in a few minutes.
# NOT a real experiment.

experiment: smoke
seed: 42

model:
  hidden_size: 64
  intermediate_size: 192
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  seq_len: 256
  rope_theta: 10000.0
  tie_word_embeddings: true

tokenizer:
  # Byte-level BPE trained on the cleaned corpus (data/tokenizer.py).
  vocab_size: 2048
  train_chars: 5000000
  dir: data/smoke/tokenizer

data:
  source: starcoderdata         # unused: scripts/smoke.sh seeds raw_dir
  language: Python

  train_tokens: 2000000
  eval_heldout_files: 50
  heldout_repo_fraction: 0.01    # share of repos held out entirely (by name hash)
  heldout_files_per_repo: 20     # cap per held-out repo, for repo diversity

  overshoot: 1.5

  raw_dir: data/smoke/raw
  clean_dir: data/smoke/clean
  dedup_dir: data/smoke/dedup
  heldout_dir: data/smoke/eval_heldout
  tokens_dir: data/smoke/tokens

clean:
  min_lines: 5
  max_lines: 20000
  max_line_length: 1000
  max_avg_line_length: 100
  min_alpha_ratio: 0.25          # fraction of alphanumeric chars
  max_non_ascii_ratio: 0.20
  require_parse: true            # must ast.parse() as valid Python 3
  drop_markers:                  # substrings that flag generated/vendored code
    - "autogenerated"
    - "auto-generated"
    - "automatically generated"
    - "do not edit"
    - "do not modify"
    - "generated by"
    - "@generated"

dedup:
  exact: true                    # sha256 of normalized content
  near: true                     # stdlib has real near-dups; exercise the path
  near_threshold: 0.85
  num_perm: 64

train:
  lr: 2.0e-3
  min_lr_ratio: 0.1              # cosine decays to lr * min_lr_ratio
  warmup_steps: 10
  weight_decay: 0.1
  per_device_batch_size: 16
  grad_accum: 1
  max_grad_norm: 1.0
  precision: bf16                # bf16 on MPS/CUDA when supported, else fp32
  logging_steps: 50
  save_steps: 400
  save_total_limit: 1
  runs_dir: runs

eval:
  suites:                        # execute-and-test problem sets
    handwritten: eval/problems/handwritten.jsonl
    humaneval: eval/problems/humaneval.jsonl
    mbpp: eval/problems/mbpp.jsonl
  completion_file: eval/problems/completion.jsonl
  fim_file: eval/problems/fim.jsonl
  max_new_tokens: 64
  temperature: 0.0               # 0 = greedy, deterministic
  num_samples: 1                 # pass@1; raise for pass@k
  timeout_sec: 10
  perplexity_tokens: 20000
  results_dir: data/smoke/results
