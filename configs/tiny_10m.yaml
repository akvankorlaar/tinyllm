# tinypython: a ~10M-parameter Python LM trained from scratch, locally.
# Sized for a 4 GB GTX 1650 (~3.8 h); configs/tiny_20m.yaml is the 19M variant
# for bigger hardware. Reproduce end to end with scripts/run_pipeline.sh.

experiment: tiny_10m
seed: 42

model:
  # MistralForCausalLM, randomly initialized. ~10.1M params with these settings
  # (embeddings tied: 16384 x 256 = 4.2M; 8 layers x 0.74M = 5.9M).
  hidden_size: 256
  intermediate_size: 704
  num_hidden_layers: 8
  num_attention_heads: 4         # head_dim 64
  num_key_value_heads: 2         # grouped-query attention
  seq_len: 512
  rope_theta: 10000.0
  tie_word_embeddings: true

tokenizer:
  # Byte-level BPE trained on the cleaned corpus (data/tokenizer.py).
  vocab_size: 16384
  train_chars: 300000000         # chars of corpus used to fit the tokenizer
  dir: data/tokenizer

data:
  # bigcode/starcoderdata: inline content, no AWS. Gated (instant accept) and
  # already near-deduplicated upstream.
  source: starcoderdata
  language: Python

  # Training tokens, measured by our tokenizer. ~20 tokens/param is
  # Chinchilla-optimal for 10M params; overtraining a small model still helps.
  train_tokens: 200000000
  eval_heldout_files: 2000      # held-out files kept for perplexity
  heldout_repo_fraction: 0.01    # share of repos held out entirely (by name hash)
  heldout_files_per_repo: 20     # cap per held-out repo, for repo diversity

  # Download overshoot: collect this multiple of train_tokens (raw, pre-clean),
  # because cleaning + dedup throw some away.
  overshoot: 2.5                  # ~46% of raw survives clean (Py2 fails ast.parse)

  raw_dir: data/raw
  clean_dir: data/clean
  dedup_dir: data/dedup
  heldout_dir: data/eval_heldout
  tokens_dir: data/tokens

clean:
  min_lines: 5
  max_lines: 20000
  max_line_length: 1000
  max_avg_line_length: 100
  min_alpha_ratio: 0.25          # fraction of alphanumeric chars
  max_non_ascii_ratio: 0.20
  require_parse: true            # must ast.parse() as valid Python 3
  drop_markers:                  # substrings that flag generated/vendored code
    - "autogenerated"
    - "auto-generated"
    - "automatically generated"
    - "do not edit"
    - "do not modify"
    - "generated by"
    - "@generated"

dedup:
  exact: true                    # sha256 of normalized content
  near: false                    # MinHash LSH; starcoderdata is already near-deduped
  near_threshold: 0.85
  num_perm: 128

train:
  lr: 2.0e-3
  min_lr_ratio: 0.1              # cosine decays to lr * min_lr_ratio
  warmup_steps: 100              # of ~1525 optimizer steps
  weight_decay: 0.1
  per_device_batch_size: 8       # fp32 bs8 peaks ~1.6 GB on the 1650
  grad_accum: 32                 # 8 x 32 x 512 = 131k tokens / optimizer step
  max_grad_norm: 1.0
  precision: bf16                # bf16 on MPS / CUDA sm_80+, else fp32
  torch_compile: false           # true speeds up CUDA; leave false on MPS
  logging_steps: 20
  save_steps: 250
  save_total_limit: 2
  runs_dir: runs

eval:
  suites:                        # execute-and-test problem sets
    handwritten: eval/problems/handwritten.jsonl
    humaneval: eval/problems/humaneval.jsonl
    mbpp: eval/problems/mbpp.jsonl
  completion_file: eval/problems/completion.jsonl
  fim_file: eval/problems/fim.jsonl
  max_new_tokens: 256
  temperature: 0.0               # 0 = greedy, deterministic
  num_samples: 1                 # pass@1; raise for pass@k
  timeout_sec: 10
  perplexity_tokens: 200000
  results_dir: eval/results
