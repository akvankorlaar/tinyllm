[project]
name = "tinypython"
version = "0.1.0"
description = "A tiny (~20M) Python LM trained from scratch, locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "tokenizers>=0.19",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    # Near-duplicate detection
    "datasketch>=1.6",
]

[tool.uv]
# This repo is a set of scripts, not an installable package.
package = false
